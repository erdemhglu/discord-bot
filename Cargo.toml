[package]
name = "discord-bot"
version = "0.2.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12", features = ["cache"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
log = "0.4"
# svg -> png rasterize (saf rust; sistemde chrome/tarayici gerekmez). raster-images
# ozelligi kapali: panelde gomulu jpeg/gif yok, kod suruklemeye gerek yok
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }

[profile.release]
strip = true
lto = true
